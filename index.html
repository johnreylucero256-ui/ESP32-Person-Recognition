<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>ESP32 Person Recognition</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 15px;
            background: #f4f4f4;
        }

        h2 {
            margin-bottom: 15px;
        }

        video {
            width: 100%;
            max-width: 400px;
            border: 2px solid black;
            border-radius: 10px;
            background: black;
        }

        button {
            padding: 12px 20px;
            margin: 8px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #start {
            background: green;
            color: white;
        }

        #stop {
            background: red;
            color: white;
        }

        #capture {
            background: blue;
            color: white;
        }

        #result {
            font-size: 28px;
            font-weight: bold;
        }

        #confidence {
            font-size: 18px;
        }

        #details {
            font-size: 14px;
            text-align: left;
            display: inline-block;
            margin-top: 10px;
        }

        #status {
            font-size: 16px;
        }
    </style>
</head>

<body>

    <h2>ESP32 Person Recognition</h2>

    <video id="camera" autoplay playsinline muted></video>

    <br>

    <button id="start">Start Camera</button>
    <button id="stop">Stop Camera</button>
    <button id="capture">Capture Test Image</button>

    <h3 id="status">Initializing model...</h3>

    <p id="result">Waiting...</p>

    <p id="confidence"></p>

    <div id="details"></div>

    <canvas id="canvas"
        width="96"
        height="96"
        style="display:none;">
    </canvas>

    <script src="edge-impulse-standalone.js"></script>
    <script src="run-impulse.js"></script>

    <script>

        const video = document.getElementById("camera");
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");

        const statusText = document.getElementById("status");
        const resultText = document.getElementById("result");
        const confidenceText = document.getElementById("confidence");
        const detailsText = document.getElementById("details");

        let classifier;
        let cameraStream;
        let timer;
        let busy = false;

        const UNKNOWN_THRESHOLD = 0.70;

        const ALLOWED_LABELS = [
            "CLARES",
            "AGUILAN"
        ];

        // INITIALIZE MODEL

        async function initializeModel() {

            try {

                classifier = new EdgeImpulseClassifier();

                await classifier.init();

                statusText.textContent = "Model Ready";

            } catch (error) {

                statusText.textContent =
                    "Model Error: " + error.message;

                console.error(error);
            }
        }

        // START CAMERA

        async function startCamera() {

            try {

                if (!classifier) {
                    statusText.textContent = "Model is not ready.";
                    return;
                }

                if (cameraStream) {
                    stopCamera();
                }

                cameraStream =
                    await navigator.mediaDevices.getUserMedia({

                        video: {
                            facingMode: "environment"
                        },

                        audio: false

                    });

                video.srcObject = cameraStream;

                await video.play();

                statusText.textContent = "Camera Started";

                timer = setInterval(runRecognition, 1000);

            } catch (error) {

                statusText.textContent =
                    "Camera Error: " + error.message;

                console.error(error);
            }
        }

        // STOP CAMERA

        function stopCamera() {

            clearInterval(timer);

            if (cameraStream) {

                cameraStream.getTracks().forEach(track => {
                    track.stop();
                });

                cameraStream = null;
            }

            video.srcObject = null;

            resultText.textContent = "Waiting...";

            confidenceText.textContent = "";

            detailsText.textContent = "";

            statusText.textContent = "Camera Stopped";
        }

        // PREPARE IMAGE - FIT SHORTEST AXIS

        function prepareImage() {

            const width = video.videoWidth;
            const height = video.videoHeight;

            if (!width || !height) {
                throw new Error("Camera image not ready");
            }

            // Scale image so the shortest dimension fills 96 pixels
            const scale = Math.max(
                96 / width,
                96 / height
            );

            const newWidth = width * scale;
            const newHeight = height * scale;

            // Center the image and crop the excess
            const x = (96 - newWidth) / 2;
            const y = (96 - newHeight) / 2;

            ctx.clearRect(0, 0, 96, 96);

            ctx.drawImage(
                video,
                0,
                0,
                width,
                height,
                x,
                y,
                newWidth,
                newHeight
            );

            const imageData =
                ctx.getImageData(0, 0, 96, 96);

            const features = [];

            // Extract RGB values

            for (
                let i = 0;
                i < imageData.data.length;
                i += 4
            ) {

                features.push(imageData.data[i]);

                features.push(imageData.data[i + 1]);

                features.push(imageData.data[i + 2]);

            }

            return features;
        }

        // RUN RECOGNITION

        function runRecognition() {

            if (
                !classifier ||
                busy ||
                video.readyState < 2
            ) {
                return;
            }

            busy = true;

            try {

                const features = prepareImage();

                const prediction =
                    classifier.classify(features);

                const results = prediction.results;

                console.log("MODEL RESULTS:", results);

                if (!results || results.length === 0) {

                    throw new Error("No prediction results returned");

                }

                // FIND HIGHEST CONFIDENCE

                let best = results.reduce((a, b) =>
                    a.value > b.value ? a : b
                );

                const confidence = best.value;

                const predictedLabel =
                    String(best.label).trim().toUpperCase();

                // DISPLAY ALL PREDICTIONS

                detailsText.innerHTML =
                    "<b>Model Predictions:</b><br>" +
                    results.map(item =>
                        item.label + ": " +
                        (item.value * 100).toFixed(2) + "%"
                    ).join("<br>");

                // DETERMINE RECOGNIZED PERSON

                if (
                    confidence >= UNKNOWN_THRESHOLD &&
                    ALLOWED_LABELS.includes(predictedLabel)
                ) {

                    resultText.textContent = predictedLabel;

                } else {

                    resultText.textContent = "UNKNOWN";

                }

                confidenceText.textContent =
                    "Confidence: " +
                    (confidence * 100).toFixed(2) + "%";

                statusText.textContent = "Recognition Active";

            } catch (error) {

                statusText.textContent =
                    "Recognition Error: " + error.message;

                console.error(error);

            } finally {

                busy = false;

            }
        }

        // CAPTURE ORIGINAL CAMERA IMAGE

        document.getElementById("capture")
            .addEventListener("click", function() {

                if (!video.videoWidth) {

                    alert("Start the camera first.");

                    return;
                }

                const testCanvas =
                    document.createElement("canvas");

                testCanvas.width = video.videoWidth;
                testCanvas.height = video.videoHeight;

                const testCtx =
                    testCanvas.getContext("2d");

                testCtx.drawImage(
                    video,
                    0,
                    0,
                    testCanvas.width,
                    testCanvas.height
                );

                const link =
                    document.createElement("a");

                link.download = "camera-test.png";

                link.href =
                    testCanvas.toDataURL("image/png");

                link.click();

            });

        // BUTTON EVENTS

        document.getElementById("start")
            .addEventListener("click", startCamera);

        document.getElementById("stop")
            .addEventListener("click", stopCamera);

        // INITIALIZE

        initializeModel();

    </script>

</body>
</html>
